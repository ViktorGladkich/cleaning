<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">

  <defs>
    <!-- Базовый сектор кольца (угол 60 градусов) -->
    <path id="orange-arc" d="M 0,-68 A 68 68 0 0 1 58.89,-34 L 43.33,-25 A 50 50 0 0 0 0,-50 Z" fill="#F25C05"/>
  </defs>

  <!-- Верхняя надпись: LUXOR -->
  <g fill="#9A9B9D">
    <!-- Буква L -->
    <path d="M 50,75 L 82,75 L 82,205 A 25 25 0 0 0 107,230 L 160,230 L 160,260 L 105,260 A 55 55 0 0 1 50,205 Z"/>

    <!-- Буква U -->
    <path d="M 195,75 L 227,75 L 227,205 A 28 28 0 0 0 255,233 A 28 28 0 0 0 283,205 L 283,75 L 315,75 L 315,205 A 60 60 0 0 1 255,265 A 60 60 0 0 1 195,205 Z"/>

    <!-- Буква X -->
    <path d="M 345,75 L 385,75 L 442,165 L 499,75 L 539,75 L 463,195 L 542,260 L 500,260 L 442,212 L 384,260 L 342,260 L 421,195 Z"/>

    <!-- Буква R -->
    <path d="M 725,75 L 810,75 C 845,75 870,98 870,132 C 870,162 848,183 818,188 L 868,260 L 832,260 L 785,192 L 757,192 L 757,260 L 725,260 Z M 757,105 L 757,162 L 805,162 C 825,162 838,150 838,133.5 C 838,117 825,105 805,105 Z"/>
  </g>

  <!-- Стилизованная буква 'O' -->
  <g transform="translate(635, 168)">
    <!-- Центральный серый круг -->
    <circle cx="0" cy="0" r="39" fill="#9A9B9D"/>

    <!-- 4 оранжевых дуговых сегмента с зазорами -->
    <use href="#orange-arc" transform="rotate(15)"/>
    <use href="#orange-arc" transform="rotate(105)"/>
    <use href="#orange-arc" transform="rotate(195)"/>
    <use href="#orange-arc" transform="rotate(285)"/>
  </g>

  <!-- Подстрочный текст: KONGRESSE | EVENTS -->
  <text x="450" y="325" text-anchor="middle" font-family="'Century Gothic', 'Montserrat', 'Arial', sans-serif" font-size="37" font-weight="400" fill="#9A9B9D" letter-spacing="16">
    KONGRESSE <tspan font-weight="300" letter-spacing="14">|</tspan> EVENTS
  </text>
</svg>
